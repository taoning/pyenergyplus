name: Build wheels

on:
  push:
    branches: [ main ]

  # run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  EnergyPlus_Commit: cf73682

jobs:
  build_ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: build wheels
      run: |
        pip install wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout $EnergyPlus_Commit
        cd ..
        sudo apt-get install ninja-build gfortran
        python setup.py bdist_wheel

    - name: Run tests
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-ubuntu
        path: ./dist


  build_test_osx:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install and test
      run: |
        pip install wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout $EnergyPlus_Commit
        cd ..
        brew install ninja gcc
        echo "FC=$(ls $(brew --prefix gcc)/bin/gfortran-* | sort | tail -1)" >> $GITHUB_ENV
        python setup.py bdist_wheel

    - name: Run tests
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-osx
        path: ./dist


  build_test_windows:
    runs-on: windows-latest
    env:
      CMAKE_Fortran_COMPILER: "/c/msys64/mingw64/bin/x86_64-w64-mingw32-gfortran.exe"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    defaults:
      run:
        shell: cmd

    steps:
    - name: Checkout pyenergyplus
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install and test
      run: |
        pip install wheel "datamodel-code-generator>=0.55.0"
        git submodule update --init --recursive
        cd EnergyPlus
        git checkout $EnergyPlus_Commit
        cd ..
        python setup.py bdist_wheel

    - name: Run tests
      run: |
        pip install dist/*.whl
        cd test
        python -m unittest discover -s . -p "test_*.py"

    - uses: actions/upload-artifact@v4
      with:
        name: dist-windows
        path: ./dist
